site_name: HydroDHM
site_description: Differentiable Hydrological Model for Data-Scarce Basins
site_author: Wenyu Ouyang
site_url: https://OuyangWenyu.github.io/HydroDHM

repo_name: OuyangWenyu/HydroDHM
repo_url: https://github.com/OuyangWenyu/HydroDHM
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Usage Guide: usage.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Models:
      - Overview: models/overview.md
      - XAJ Model:
          - Introduction: models/xaj/introduction.md
      - Deep Learning Models:
          - Introduction: models/deep-learning/introduction.md
          - Detailed Guide: models/deep-learning/detailed-guide.md
  - About:
      - Citation: about/citation.md
      - Contributing: about/contributing.md
      - License: about/license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OuyangWenyu/HydroDHM
    - icon: fontawesome/solid/paper-plane
      link: mailto:wenyuouyang@outlook.com

copyright: Copyright &copy; 2023-2025 Wenyu Ouyang
