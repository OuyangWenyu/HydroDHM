site_name: HydroDHM
site_description: Differentiable Hydrological Model for Data-Scarce Basins
site_author: Wenyu Ouyang
site_url: https://OuyangWenyu.github.io/HydroDHM

repo_name: OuyangWenyu/HydroDHM
repo_url: https://github.com/OuyangWenyu/HydroDHM
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Models:
      - Overview: models/overview.md
      - XAJ Model:
          - Introduction: models/xaj/introduction.md
          - Calibration: models/xaj/calibration.md
          - Evaluation: models/xaj/evaluation.md
          - Visualization: models/xaj/visualization.md
      - Deep Learning Models:
          - Introduction: models/deep-learning/introduction.md
          - LSTM: models/deep-learning/lstm.md
          - DPL-XAJ: models/deep-learning/dpl-xaj.md
          - Training Guide: models/deep-learning/training.md
  - Datasets:
      - Overview: datasets/overview.md
      - CAMELS: datasets/camels.md
      - Custom Data: datasets/custom-data.md
  - Tutorials:
      - XAJ Calibration: tutorials/xaj-calibration.md
      - LSTM Training: tutorials/lstm-training.md
      - DPL-XAJ Training: tutorials/dpl-xaj-training.md
      - Multi-Basin Analysis: tutorials/multi-basin.md
  - Advanced:
      - Hyperparameter Tuning: advanced/hyperparameter-tuning.md
      - Multi-GPU Training: advanced/multi-gpu.md
      - Custom Models: advanced/custom-models.md
      - Troubleshooting: advanced/troubleshooting.md
  - API Reference:
      - XAJ API: api/xaj.md
      - Deep Learning API: api/deep-learning.md
      - Utilities: api/utilities.md
  - About:
      - Citation: about/citation.md
      - Contributing: about/contributing.md
      - License: about/license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OuyangWenyu/HydroDHM
    - icon: fontawesome/solid/paper-plane
      link: mailto:wenyuouyang@outlook.com

copyright: Copyright &copy; 2023-2025 Wenyu Ouyang
