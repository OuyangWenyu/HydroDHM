# XAJ模型率定配置文件示例
# 基于旧版 calibrate_xaj.py 的默认参数

data:
  # 数据集类型和路径
  dataset: "camels_us"  # 或 "camels", "owndata" 等
  path: "D:\\project\\data"  # 数据目录路径

  # 流域设置
  basin_ids:
    - "01013500"  # 可以包含多个流域ID

  # 时间段设置
  "train_period": ["1985-10-01", "1995-09-30"]
  "valid_period": ["1995-10-01", "2005-09-30"]
  "test_period": ["2005-10-01", "2014-09-30"]  

  # 其他数据参数
  warmup_length: 365  # 预热期天数
  variables:  # 输入变量
    - "precipitation"     # 降水
    - "potential_evapotranspiration"      # 潜在蒸发
    - "streamflow"  # 径流（观测值）

  # 交叉验证（可选）
  cv_fold: 1  # 交叉验证折数，1表示不使用交叉验证

  # 结果输出
  output_dir: "results"
  experiment_name: "expchangdian_61561"

model:
  # 模型类型
  name: "xaj_mz"  # 可选: "xaj", "xaj_mz"

  # 模型参数
  params:
    source_type: "sources"  # 或 "sources5mm"
    source_book: "HF"       # "HF" (Hydrological Forecast) 或 "EH" (Engineering Hydrology)
    kernel_size: 15         # 卷积核大小
    time_interval_hours: 24 # 时间间隔（小时）

training:
  # 率定算法
  algorithm: "SCE_UA"  # 可选: "SCE_UA", "GA", "scipy"

  # 损失函数
  loss: "RMSE"  # 可选: "RMSE", "NSE", "KGE" 等

  # SCE_UA 算法参数
  SCE_UA:
    random_seed: 1234
    rep: 1000    # 最大迭代次数（模型调用次数）
    ngs: 1000       # 复合体数量（建议大于参数数量）
    kstop: 50       # 停止准则（进化轮次）
    peps: 0.1       # 收敛阈值（%，0.1表示1/1000的相对变化）
    pcento: 0.1     # 收敛百分比

  # GA 算法参数（备选）
  # GA:
  #   random_seed: 1234
  #   run_counts: 2     # 运行次数
  #   pop_num: 50       # 种群数量
  #   cross_prob: 0.5   # 交叉概率
  #   mut_prob: 0.5     # 变异概率
  #   save_freq: 1      # 保存频率

evaluation:
  # 评估指标
  metrics:
    - "NSE"   # Nash-Sutcliffe效率系数
    - "KGE"   # Kling-Gupta效率
    - "RMSE"  # 均方根误差
