name: build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macOS-latest]
                python-version: ["3.11", "3.12"]

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"

            - name: Setup Python and create virtual environment
              run: |
                  uv python install ${{ matrix.python-version }}
                  uv venv

            # 在 jobs.<job_id>.steps 中加入这两步之一（二者一起放且带 if 条件）
            - name: Clean old uv cache and env (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                Write-Host "🧹 Cleaning old uv cache and virtual environments (Windows)..."
                try {
                  uv cache clean
                } catch {
                  Write-Host "uv cache clean failed or not available - continuing..."
                }
                # remove .venv directory if exists
                Remove-Item -LiteralPath .venv -Recurse -Force -ErrorAction SilentlyContinue
                # remove uv.lock if exists
                Remove-Item -LiteralPath uv.lock -Force -ErrorAction SilentlyContinue

            - name: Clean old uv cache and env (Linux/macOS)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                echo "🧹 Cleaning old uv cache and virtual environments (Unix)..."
                uv cache clean || true
                rm -rf .venv || true
                rm -f uv.lock || true

            - name: Configure for Linux (disable CUDA index)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  # GitHub-hosted Ubuntu runners do not have NVIDIA CUDA drivers,
                  # so ensure we install CPU wheels for PyTorch-related packages.
                  python3 << 'EOF'
                  with open('pyproject.toml', 'r', encoding='utf-8') as f:
                      lines = f.readlines()

                  new_lines = []
                  in_pytorch_index_block = False

                  for i, line in enumerate(lines):
                      if 'extra-index-url' in line and 'pytorch.org' in line:
                          if line.lstrip().startswith('#'):
                              new_lines.append(line)
                          else:
                              new_lines.append('# ' + line.rstrip() + '  # Disabled for Ubuntu runners\n')
                          continue

                      if '[[tool.uv.index]]' in line:
                          if i + 1 < len(lines) and 'pytorch-cuda' in lines[i + 1]:
                              if line.lstrip().startswith('#'):
                                  new_lines.append(line)
                              else:
                                  in_pytorch_index_block = True
                                  new_lines.append('# ' + line.rstrip() + '  # Disabled for Ubuntu runners\n')
                              continue

                      if in_pytorch_index_block:
                          stripped = line.strip()
                          if stripped and (stripped.startswith('name') or stripped.startswith('url') or stripped.startswith('explicit')):
                              if line.lstrip().startswith('#'):
                                  new_lines.append(line)
                              else:
                                  new_lines.append('# ' + line.rstrip() + '  # Disabled for Ubuntu runners\n')
                              if 'explicit' in line:
                                  in_pytorch_index_block = False
                              continue
                          elif not stripped:
                              new_lines.append(line)
                              continue
                          else:
                              in_pytorch_index_block = False

                      new_lines.append(line)

                  with open('pyproject.toml', 'w', encoding='utf-8') as f:
                      f.writelines(new_lines)

                  print("✅ Disabled CUDA-specific indexes for Ubuntu runner")
                  EOF
                
            - name: Configure for macOS (remove CUDA index)
              if: matrix.os == 'macOS-latest'
              run: |
                  # macOS doesn't support CUDA, remove CUDA index from pyproject.toml
                  python3 << 'EOF'
                  with open('pyproject.toml', 'r', encoding='utf-8') as f:
                      lines = f.readlines()
                  
                  new_lines = []
                  in_pytorch_index_block = False
                  
                  for i, line in enumerate(lines):
                      # Check if this line contains extra-index-url with pytorch.org
                      if 'extra-index-url' in line and 'pytorch.org' in line:
                          new_lines.append('# ' + line.rstrip() + '  # Disabled for macOS\n')
                          continue
                      
                      # Check if we're entering the pytorch-cuda index block
                      if '[[tool.uv.index]]' in line:
                          # Look ahead to see if this is pytorch-cuda
                          if i + 1 < len(lines) and 'pytorch-cuda' in lines[i + 1]:
                              in_pytorch_index_block = True
                              new_lines.append('# ' + line.rstrip() + '  # Disabled for macOS\n')
                              continue
                      
                      # If we're in the pytorch-cuda index block, comment out the lines
                      if in_pytorch_index_block:
                          if line.strip() and (line.strip().startswith('name') or 
                                             line.strip().startswith('url') or 
                                             line.strip().startswith('explicit')):
                              new_lines.append('# ' + line.rstrip() + '  # Disabled for macOS\n')
                              # Check if this is the last line of the block (explicit = true)
                              if 'explicit' in line:
                                  in_pytorch_index_block = False
                              continue
                          elif not line.strip():  # Empty line
                              new_lines.append(line)
                              continue
                          else:  # Next section started
                              in_pytorch_index_block = False
                      
                      new_lines.append(line)
                  
                  with open('pyproject.toml', 'w', encoding='utf-8') as f:
                      f.writelines(new_lines)
                  
                  print("✅ Removed CUDA index from pyproject.toml for macOS")
                  EOF

            - name: Install dependencies
              run: |
                  # Use unsafe-best-match strategy to allow uv to find the best version across all indexes
                  # This is safe because both PyPI and PyTorch index are trusted sources
                  # This resolves the conflict where PyTorch index has numpy with incompatible versions,
                  # while PyPI has compatible versions that satisfy all dependencies (numpy>=2.2.6,<2.3)
                  uv sync --all-extras --index-strategy unsafe-best-match

            - name: Create hydro_setting.yml (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  echo 'local_data_path:' > hydro_setting.yml
                  echo '  datasets-origin: /home/runner/.cache/' >> hydro_setting.yml
                  sudo cp hydro_setting.yml /home/runner/hydro_setting.yml

            - name: Create hydro_setting.yml (macOS)
              if: matrix.os == 'macOS-latest'
              run: |
                  echo 'local_data_path:' > hydro_setting.yml
                  echo '  datasets-origin: /Users/runner/.cache/' >> hydro_setting.yml
                  sudo cp hydro_setting.yml /Users/runner/hydro_setting.yml

            - name: Create hydro_setting.yml (Windows)
              if: matrix.os == 'windows-latest'
              run: |
                  echo 'local_data_path:' > hydro_setting.yml
                  echo '  datasets-origin: C:\Users\runneradmin\.cache\' >> hydro_setting.yml
                  copy hydro_setting.yml C:\Users\runneradmin\hydro_setting.yml

            - name: Verify installation
              run: |
                  uv run python -c "import sys; print(f'Python {sys.version}')"
                  uv run python -c "import torch; print(f'PyTorch {torch.__version__}')"
                  uv run python -c "import xarray; print(f'xarray {xarray.__version__}')"
                  uv run python -c "import geopandas; print(f'geopandas {geopandas.__version__}')"

