name: docs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git info

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
              $env:UV_EXTRA_INDEX_URL = ""
              uv sync --all-extras --index-strategy unsafe-best-match --index-url https://pypi.org/simple --no-config

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
              UV_EXTRA_INDEX_URL="" uv sync --all-extras --index-url https://pypi.org/simple --index-strategy unsafe-best-match --no-config

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Build documentation
        run: uv run mkdocs build --verbose

      - name: Deploy documentation
        run: uv run mkdocs gh-deploy --force --verbose
