[project]
name = "HydroDHM"
version = "0.1.0"
description = "A Differentiable Hydrological Model in Data-Scarce Basins"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel",
    "xarray",
    "netcdf4",
    "geopandas",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "torch",
    "tensorboard",
    "torchvision",
    "tqdm",
    "pytest",
    "black",
    "flake8",
    "tbparse",
    "setuptools",
    "wheel",
    "twine",
    "bump2version",
    # Linux/macOS 特定版本
    "eccodes>=2.44.0,<2.44.1; platform_system == 'Linux' or platform_system == 'Darwin'",
    "eccodeslib>=2.44.0.5,<2.44.0.6; platform_system == 'Linux' or platform_system == 'Darwin'",
    # Windows 使用更宽松的版本要求（eccodeslib 在 Windows 上不可用）
    "eccodes; platform_system == 'Windows'",
    "torchhydro",
    "hydroutils>=0.1.0",
    "hydrodatasource>=0.2.0",
    "hydromodel>=0.3.0",
    "hydrodataset>=0.2.2",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.20", 
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
    "pymdown-extensions>=10.3",
]

[tool.uv]
# ✅ 默认使用 PyPI 主源（用于绝大多数依赖）
index-url = "https://pypi.org/simple"

# ✅ 仅在安装 torch/torchvision 时才使用 CUDA 源
extra-index-url = ["https://download.pytorch.org/whl/cu118"]

# ✅ 使用更宽松的索引策略，让 uv 能跨源查找兼容版本
index-strategy = "unsafe-best-match"

# ✅ 强制覆盖旧 requests 限制，保证 hydrodataset 与 mkdocs-material 兼容
override-dependencies = [
    "pandas>=2.2.0",
    "requests>=2.32.4",
]

# ✅ 允许预发布版本（例如 scipy 或 hydromodel 的 rc 版）
prerelease = "allow"

# ✅ 注册额外的索引源
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"
