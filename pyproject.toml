[project]
name = "HydroDHM"
version = "0.1.0"
description = "A Differentiable Hydrological Model in Data-Scarce Basins"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel",
    "xarray",
    "netcdf4",
    "geopandas",
    "matplotlib",
    "scikit-learn",
    "scipy==1.13.*",
    "torch",
    "tensorboard",
    "torchvision",
    "tqdm",
    "pytest",
    "black",
    "flake8",
    "tbparse",
    "setuptools",
    "wheel",
    "twine",
    "bump2version",
    "eccodes>=2.44.0,<2.44.1",
    "torchhydro",
    "hydroutils>=0.1.0",
    "hydrodataset>=0.2.0",
    "hydrodatasource>=0.2.0",
    "hydromodel>=0.3.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]

[tool.uv]
# For PyTorch with CUDA support, use the PyTorch index
index-url = "https://download.pytorch.org/whl/cu118"
extra-index-url = ["https://pypi.org/simple"]

# Override dependencies from aqua-fetch to use newer pandas
override-dependencies = [
    "pandas>=2.2.0",
]

# Allow pre-release versions (e.g., aqua-fetch 1.0.0rc3)
prerelease = "allow"

[tool.uv.sources]
# Specify PyTorch packages to come from the PyTorch index
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

