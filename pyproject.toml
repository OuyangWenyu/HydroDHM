[project]
name = "HydroDHM"
version = "0.1.0"
description = "A Differentiable Hydrological Model in Data-Scarce Basins"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel",
    "xarray",
    "netcdf4",
    "geopandas",
    "matplotlib",
    "scikit-learn",
    "scipy==1.13.*",
    "torch",
    "tensorboard",
    "torchvision",
    "tqdm",
    "pytest",
    "black",
    "flake8",
    "tbparse",
    "setuptools",
    "wheel",
    "twine",
    "bump2version",
    # Linux/macOS 特定版本
    "eccodes>=2.44.0,<2.44.1; platform_system == 'Linux' or platform_system == 'Darwin'",
    "eccodeslib>=2.44.0.5,<2.44.0.6; platform_system == 'Linux' or platform_system == 'Darwin'",
    # Windows 使用更宽松的版本要求（eccodeslib 在 Windows 上不可用）
    "eccodes; platform_system == 'Windows'",
    "torchhydro",
    "hydroutils>=0.1.0",
    "hydrodatasource>=0.2.0",
    "hydromodel>=0.3.0",
    "hydrodataset>=0.2.2",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]

[tool.uv]
# Use PyPI as default index (supports all platforms including macOS)
# CUDA versions will be used on Linux/Windows when available from extra-index-url
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu118"]

# Override dependencies from aqua-fetch to use newer pandas
override-dependencies = [
    "pandas>=2.2.0",
]

# Allow pre-release versions (e.g., aqua-fetch 1.0.0rc3)
prerelease = "allow"

# Note: We use --index-strategy unsafe-best-match in workflow to allow uv to find
# the best version across all indexes. This is needed because:
# - PyTorch index has numpy but with versions that don't satisfy all dependencies
# - PyPI has compatible numpy versions (>=2.2.6,<2.3) that work with scipy and hydromodel
# - torch and torchvision should come from PyTorch index (CUDA versions for Linux/Windows)
# - Other packages (numpy, scipy, etc.) should come from PyPI

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

