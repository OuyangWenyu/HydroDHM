[project]
name = "HydroDHM"
version = "0.1.0"
description = "A Differentiable Hydrological Model in Data-Scarce Basins"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel",
    "xarray",
    "netcdf4",
    "geopandas",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "torch",
    "tensorboard",
    "torchvision",
    "tqdm",
    "pytest",
    "black",
    "flake8",
    "tbparse",
    "setuptools",
    "wheel",
    "twine",
    "bump2version",
    # Linux/macOS 特定版本
    "eccodes>=2.44.0,<2.44.1; platform_system == 'Linux' or platform_system == 'Darwin'",
    "eccodeslib>=2.44.0.5,<2.44.0.6; platform_system == 'Linux' or platform_system == 'Darwin'",
    # Windows 使用更宽松的版本要求（eccodeslib 在 Windows 上不可用）
    "eccodes; platform_system == 'Windows'",
    "torchhydro",
    "hydroutils>=0.1.0",
    "hydrodatasource>=0.2.0",
    "hydromodel>=0.3.0",
    "hydrodataset>=0.2.2",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.20", 
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
    "pymdown-extensions>=10.3",
]

[tool.uv]
index-url = "https://pypi.org/simple"
index-strategy = "unsafe-best-match"
prerelease = "allow"
override-dependencies = [
    "pandas>=2.2.0",
    "requests>=2.32.4",
]

# ✅ 将 CUDA 仓库设为 explicit，只有指定 --index 才会用
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
explicit = true


[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"
